server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight container health probe (separate from backend /health)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets cached long-term
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback + security headers
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.yourdomain.com wss://generativelanguage.googleapis.com https://generativelanguage.googleapis.com; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self)" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
