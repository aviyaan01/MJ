server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight container health probe (separate from backend /health)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets cached long-term
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # If proxying backend API routes through Nginx with Fastify trustProxy=true, overwrite client X-Forwarded-For:
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $remote_addr;

    # SPA fallback + security headers (CSP permits HTTPS backend + Gemini Live WSS)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self)" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
